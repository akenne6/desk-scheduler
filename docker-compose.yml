services:
  postgres:
    image: postgres:16-alpine
    container_name: desk-scheduler-postgres
    environment:
      POSTGRES_DB: desk_scheduler
      POSTGRES_USER: desk_scheduler
      POSTGRES_PASSWORD: desk_scheduler
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U desk_scheduler -d desk_scheduler"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
