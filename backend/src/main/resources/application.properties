spring.application.name=desk-scheduler
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# OpenAPI / Swagger UI (springdoc). Defaults expose JSON at /v3/api-docs and UI at /swagger-ui.html.
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.try-it-out-enabled=true
springdoc.swagger-ui.operations-sorter=method
springdoc.api-docs.path=/v3/api-docs

# Database connection. Env vars override the defaults, which match docker-compose.yml for zero-config local dev.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/desk_scheduler}
spring.datasource.username=${DB_USER:desk_scheduler}
spring.datasource.password=${DB_PASSWORD:desk_scheduler}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate. Flyway owns schema; Hibernate validates entity-to-table mapping at startup.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false

# Flyway.
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
